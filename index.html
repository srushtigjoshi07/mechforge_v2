<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            Object.defineProperty(window, 'fetch', {
              value: origFetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Could not redefine window.fetch:', e);
        }
      })();
    </script>
